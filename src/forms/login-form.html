<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
</head>
<body >
    <section class="fixed h-screen w-full flex justify-center items-center">
        <div class="col-12 col-sm-6 col-md-5 col-xl-3">
            <div class="flex flex-col gap-md p-5 bg-blanco rounded-lg shadow-md">

            <h1 class="text-h3 font-bold text-color-base">
                Iniciar Sesión
            </h1>

            <div class="flex flex-col gap-xs">
                <label class="text-sm text-color-secondary" for="email">
                Correo electrónico
                </label>
                <input
                id="email"
                type="email"
                placeholder="Correo"
                required
                class="p-1 rounded-sm border border-matriz text-base"
                />
            </div>

            <div class="flex flex-col gap-xs">
                <label class="text-sm text-color-secondary" for="password">
                Contraseña
                </label>
                <input
                id="password"
                type="password"
                placeholder="Contraseña"
                required
                class="p-1 rounded-sm border border-matriz text-base"
                />
            </div>

            <button id="btnEnviar"
                class="w-full p-2 bg-primario text-blanco rounded-md font-semibold cursor-pointer">
                Entrar
            </button>

            <p id="msg" class="text-sm text-error text-center"></p>

            </div>
        </div>
    </section>
</body>
</html>
