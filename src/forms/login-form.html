<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    /* =============================
    FORMULARIO DE LOGIN
    ============================= */

        .form-login {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            margin-top: var(--space-margin-xl);
            padding: var(--space-padding-lg);
            background: var(--color-blanco);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
        }

        .form-login-title {
            font-size: var(--font-size-h3);
            font-weight: var(--font-weight-titulos);
            color: var(--font-color-texto);
            text-align: center;
            margin-bottom: var(--space-margin-md);
        }

        .form-login-group {
            display: flex;
            flex-direction: column;
            margin-bottom: var(--space-margin-md);
        }

        .form-login-group label {
            font-size: var(--font-size-texto-secundario);
            color: var(--font-color-texto-secundario);
            margin-bottom: var(--space-margin-xs);
        }

        .form-login-group input {
            padding: var(--space-padding-sm);
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--color-matriz);
            font-size: var(--font-size-texto);
            color: var(--font-color-texto);
            background: var(--color-blanco);
        }

        .form-login-group input:focus {
            outline: none;
            border-color: var(--color-primario);
            box-shadow: var(--shadow-xs);
        }

        .form-login-button {
            width: 100%;
            padding: var(--space-padding-md);
            background: var(--color-primario);
            color: var(--color-blanco);
            border: none;
            border-radius: var(--border-radius-md);
            font-size: var(--font-size-texto);
            font-weight: var(--font-weight-resaltado);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .form-login-button:hover {
            background: var(--color-secundario);
        }

        .form-login-msg {
            margin-top: var(--space-margin-sm);
            text-align: center;
            font-size: var(--font-size-texto-secundario);
            color: var(--color-sem-error);
        }
    </style>
    <div class="form-login">

        <h1 class="form-login-title">Iniciar Sesión</h1>

        <div class="form-login-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="Correo" required>
        </div>

        <div class="form-login-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>

        <button id="btnEnviar" class="form-login-button">
            Entrar
        </button>

        <p id="msg" class="form-login-msg"></p>

    </div>
</body>
</html>
