<body class="bg-complementario-secundario min-h-screen">

    <!-- Contenido principal -->
    <main class="container mx-auto p-4" id="mainContent">
        <div class="row">
            <div class="col-12">
                <!-- El contenido se cargará dinámicamente aquí -->

                    <!-- Página de inicio por defecto -->
                    <div class="text-center py-12">
                        <h1 class="text-h1 text-primario mb-4 animate__animated animate__fadeIn">

                        <div class="row justify-center gap-4 py-5">

        Cargando menú...

    <script type="module" src="../app/main.js"></script>
    <script type="module">
        // Enrutamiento SPA simple
        import { Navigate } from "../app/class/navigate.js";
        
        async function loadView(hash) {
            const contentDiv = document.getElementById('dynamicContent');
            
            // Remover # del hash
            const viewPath = hash.replace('#', '') || '/';
            
            try {
                if (viewPath === '/') {
                    // Ya está cargada la página de inicio
                    return;
                }
                
                // Cargar vista desde archivo
                const response = await fetch(viewPath);
                
                if (!response.ok) {
                    throw new Error('Vista no encontrada');
                }
                
                const html = await response.text();
                contentDiv.innerHTML = html;
                
                // Ejecutar scripts de la vista
                const scripts = contentDiv.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    newScript.type = 'module';
                    document.body.appendChild(newScript);
                    oldScript.remove();
                });
                
            } catch (error) {
                console.error('Error cargando vista:', error);
                contentDiv.innerHTML = `
                    <div class="p-8 text-center">
                        <h2 class="text-h3 text-error mb-4">Error 404</h2>
                        <p class="text-lg text-complementario mb-6">
                            La página solicitada no fue encontrada.
                        </p>
                        <a href="#/" class="p-2 bg-primario text-blanco rounded-2 no-underline">
                            Volver al inicio
                        </a>
                    </div>
                `;
            }
        }
        
        // Escuchar cambios en el hash
        window.addEventListener('hashchange', () => {
            loadView(window.location.hash);
        });
        
        // Cargar vista inicial
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                loadView(window.location.hash);
            }
        });
    </script>
</body>
</html>
